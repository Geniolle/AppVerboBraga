version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: appverbobraga-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app_igreja}
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-app_igreja}"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    networks:
      - app_network

  web:
    build: .
    container_name: appverbobraga-web-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PRODUCTION: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app_igreja}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      ADMIN_LOGIN_EMAIL: ${ADMIN_LOGIN_EMAIL}
      ADMIN_LOGIN_PASSWORD: ${ADMIN_LOGIN_PASSWORD}
      ADMIN_PROFILE_NAMES: ${ADMIN_PROFILE_NAMES:-admin,administrador}
      ENTITY_SUPERUSER_PROFILE_NAME: ${ENTITY_SUPERUSER_PROFILE_NAME}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - static_prod:/app/static
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - app_network


volumes:
  pg_data_prod:
  static_prod:

networks:
  app_network:
    driver: bridge
