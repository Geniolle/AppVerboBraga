# Nginx configuration for AppVerboBraga production
# This file configures Nginx as a reverse proxy for the FastAPI application

# Upstream (backend FastAPI application)
upstream appverbobraga {
    server web:8000;
}

# HTTP redirect to HTTPS (when certificates are available)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow Let's Encrypt ACME challenge for certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

