# AppVerboBraga Nginx Configuration
# This configuration supports two deployment phases:
# PHASE 1: Development/Initial Deploy (HTTP only, no certificate)
# PHASE 2: Production (HTTPS, with certificate)

# Upstream FastAPI application
upstream appverbobraga {
    server web:8000;
}

# PHASE 1: HTTP Server (Bootstrap - Valid when certificate is not yet available)
# This server block handles initial HTTP requests and ACME challenges
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge endpoint for Let's Encrypt certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # All other HTTP traffic to FastAPI
    # NOTE: After HTTPS is configured, change this to redirect to HTTPS
    location / {
        proxy_pass http://appverbobraga;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://appverbobraga;
        proxy_http_version 1.1;
        access_log off;
    }
}

